name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: greenhouse_test
          POSTGRES_DB: greenhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: greenhouse_test
      POSTGRES_DB: greenhouse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      BACKEND_CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seed
        working-directory: backend
        run: python -m app.db.seed
      - name: Run tests
        working-directory: backend
        run: pytest -v --maxfail=1

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8002
        run: npm run build

  ml:
    name: ML (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check ml/
      - name: Generate synthetic dataset
        run: python -m ml.data.download
      - name: Run tests
        run: pytest ml/tests/ -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || true
          pip-audit -r ml/requirements.txt || true
      - name: Node dependency audit
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: smart-greenhouse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: smart-greenhouse-frontend:ci
          build-args: VITE_API_BASE_URL=http://localhost:8002
          cache-from: type=gha
          cache-to: type=gha,mode=max